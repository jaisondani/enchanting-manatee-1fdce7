[build]
  publish = "."
  functions = "netlify/functions"

# Security headers are configured in _headers to avoid conflicts.
# See _headers for full security header definitions.

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
